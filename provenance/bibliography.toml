# Bibliography registry (PROV-02). One entry per source; code cites entries by `id` in
# `@source:` tags (PROV-03). Checked by `cargo xtask provenance lint`.
#
# Fields: id, title, url, license (SPDX id, or "unstated"), redistributable (whether an archived
# copy may be committed), retrieved (YYYY-MM-DD), version, sha256 (of the retrieved copy), notes.

[[source]]
id = "fullsnes"
title = "fullsnes: Nocash SNES Specs (Martin Korth)"
url = "https://problemkaputt.de/fullsnes.htm"
license = "unstated"
redistributable = false
retrieved = "2026-11-12"
version = "HTML page last modified 2021-01-28"
sha256 = "3853b65a7331bf12eea431ff494a2948a1c78ef22f7e819db4b139fd5a79f6c6"
notes = """
Anchors are the document's own HTML anchor names, as in its table of contents and in links such as fullsnes.htm#snesdmatransfers: \
fullsnes#snesdmatransfers, fullsnes#snesppucolormath, fullsnes#snestiminghvevents. A browser's "save page" rewrites the HTML (tags, charset \
meta, tbody), so the reading copy is the file as served, which matches sha256. Vetted 2026-11-18 for M2 (issue #71): every section on the \
I/O map, memory, DMA and HDMA, PPU, maths, controllers (I/O ports and joypad), cartridge header, PCBs, ROM-image headers and interleave, LoROM \
and HiROM mapping, unpredictable things, timings, CPU and PPU pinouts and the Xboo WRAM boot was read; none quotes emulator source code. \
Its formulas (e.g. the Mode 7 matrix and the BGnHOFS write-twice rule) are the author's own notation. The auto-joypad passage in \
#snescontrollersioportsautomaticreading quotes anomie-timing: cite anomie-timing for it. Some passages draw on Nintendo's development manuals \
(the all-caps notes under SETINI in #snesppucontrol, the book2.pdf references in #snescartridgepcbs, the ExHiROM file ordering in \
#snescartridgeromimageinterleave); the project owner decided on 2026-11-18 that they may be cited through fullsnes. RESTRICTED: the \
"Boot ROM Disassembly" listing in #snesapumaincpucommunicationport is a disassembly of Nintendo's IPL firmware and is not a usable source \
(see provenance/exposures.md, 2026-11-18); the uploader protocol above it remains usable."""

