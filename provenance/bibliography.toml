[[source]]
id = "sst-65816"
title = "SingleStepTests 65816: per-instruction test vectors"
url = "https://github.com/SingleStepTests/65816"
license = "MIT"
redistributable = true
retrieved = "2026-11-12"
version = "Commit 307c63f5673c8c6b861c52f71ddb89212a227480"
notes = """
Fetched by `cargo xtask vectors fetch` and never committed; per-file hashes are in tests/assets/vectors.lock, so the entry has no sha256. Test evidence, \
not a specification: the README does not say how the vectors were produced, so they confirm or contradict a reading of a document and do not replace \
one. Behaviour that only the vectors settle needs an ADR naming the deciding tests by file and test name. Anchors name the vector file without `v1/` and \
`.json`, e.g. sst-65816#a9.n for opcode A9 in native mode and sst-65816#a9.e in emulation mode; a test that runs the whole set cites sst-65816 alone."""
