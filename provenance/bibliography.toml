[[source]]
id = "wdc-w65c816s"
title = "W65C816S 8/16-bit Microprocessor datasheet (Western Design Center)"
url = "https://www.westerndesigncenter.com/wdc/documentation/w65c816s.pdf"
license = "unstated"
redistributable = false
retrieved = "2026-11-12"
version = "Dated March 13, 2024"
sha256 = "b9177e1b045d2c8a801d1b23619abb4e5b29b88868fa491df7296dbc0b13447e"
notes = """
Copyright Western Design Center, all rights reserved: the PDF and any text extracted from it stay outside the repo. Anchor forms, always using the numbers \
printed in the document: a section is its number (wdc-w65c816s#2.20, wdc-w65c816s#3.5.11); a table or figure is `table-` or `figure-` plus its number \
(wdc-w65c816s#table-5-4, wdc-w65c816s#figure-2-1); a row of Table 5-7, Instruction Operation, adds the row label printed in its Address Mode column \
(wdc-w65c816s#table-5-7-1a, wdc-w65c816s#table-5-7-22d); a numbered note under Table 5-7 is wdc-w65c816s#table-5-7-note-4. Code that implements a per-cycle \
sequence cites the Table 5-7 row, not the table as a whole."""

[[source]]
id = "wdc-65816-manual"
title = "Programming the 65816, Including the 6502, 65C02 and 65802 (David Eyes and Ron Lichty; published by the Western Design Center)"
url = "https://archive.org/details/65816programmanual"
license = "unstated"
redistributable = false
retrieved = "2026-11-12"
version = "WDC edition, copyright 2007"
sha256 = "dbccafcc47d6e53436bdc1c0049b3c54ffacfc9034a4041a7d92b6e6c5d72bb5"
notes = """
File 65816Programmanual.pdf, from the Internet Archive item at the URL. Retrieved by hand by the project owner. Copyright 2007 The Western Design Center, all rights reserved: the PDF and any text \
extracted from it stay outside the repo. Vetted before registration (2026-11-12): a programming textbook whose listings are 65816 assembly, including the \
DEBUG16 step-and-trace debugger of chapter 15, which runs on the processor itself; no emulator source code. Anchors name the chapter number, optionally \
followed by a heading in kebab case, e.g. wdc-65816-manual#chapter-7 or wdc-65816-manual#chapter-18-adc. Where it and the datasheet differ, the datasheet \
wins unless an ADR says otherwise."""

