version = "Revision 1157, 2007-07-12"
sha256 = "19dfdf3f1c206655b8ede11bcd6dc053e36634f876819e40bb39cfb88a237dfd"
notes = """
File regs.txt. Retrieved by hand by the project owner (the page refuses automated retrieval). Anchors: a register entry is its address as \
printed at the start of the entry, in lower case (anomie-regs#2100, anomie-regs#210d, anomie-regs#43x0, anomie-regs#43xa). A section is the \
path of its headings from the top, each in kebab case, joined by `/` (anomie-regs#sprites, anomie-regs#backgrounds/mode-7, \
anomie-regs#rendering-the-screen/mosaic). Kebab case lower-cases the heading, writes `&` as `and`, drops parenthesised text and other \
punctuation, and joins words with `-`."""

