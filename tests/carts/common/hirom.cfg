# HiROM, 64 KiB: one bank at $C0:0000-$FFFF, whose upper half the CPU also sees at
# $8000-$FFFF of bank $00, where it starts
# (fullsnes#snescarthirommappingromdividedinto64kbanksaround500games). The header and the
# vectors end the bank (fullsnes#snescartridgeromheader). Code runs from the upper half;
# LOWDATA is a far segment for data in the lower half. ADR 0013.
MEMORY {
    LOW: start = $C00000, size = $8000, fill = yes, fillval = $00, file = %O;
    ROM: start = $8000,   size = $8000, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    LOWDATA: load = LOW, type = ro, optional = yes;
    CODE:    load = ROM, type = ro;
    RODATA:  load = ROM, type = ro, optional = yes;
    HEADER:  load = ROM, type = ro, start = $FFC0;
    VECTORS: load = ROM, type = ro, start = $FFE0;
}
