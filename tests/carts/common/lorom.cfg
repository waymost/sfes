# LoROM, 32 KiB: one bank, seen by the CPU at $8000-$FFFF of bank $00 and its mirrors
# (fullsnes#snescartlorommappingromdividedinto32kbanksaround1500games). The header and the
# vectors end the bank (fullsnes#snescartridgeromheader). ADR 0013.
MEMORY {
    ROM: start = $8000, size = $8000, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    CODE:    load = ROM, type = ro;
    RODATA:  load = ROM, type = ro, optional = yes;
    HEADER:  load = ROM, type = ro, start = $FFC0;
    VECTORS: load = ROM, type = ro, start = $FFE0;
}
