[package]
name = "sfes-snes-core"
description = "The Snes machine: bus, scheduler, DMA/HDMA, 5A22 I/O and controller ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bitflags.workspace = true
sfes-api.workspace = true
sfes-snes-cart.workspace = true
sfes-snes-cpu.workspace = true
thiserror.workspace = true

[dev-dependencies]
sfes-snes-cart = { workspace = true, features = ["test-support"] }

[features]
default = ["std"]
std = ["sfes-api/std", "sfes-snes-cart/std", "sfes-snes-cpu/std", "thiserror/std"]
