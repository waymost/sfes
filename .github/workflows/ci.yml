name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      # Import grouping uses unstable rustfmt options (AGENTS.md section 4).
      - run: cargo +nightly fmt --all --check -- --config group_imports=StdExternalCrate,imports_granularity=Crate

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The 65816 vectors run in full on Linux and as a fixed sample, the first 500 tests of
        # each file, on macOS and Windows (ADR 0004). An empty sample runs every test.
        include:
          - os: ubuntu-latest
            vector-sample: ""
          - os: macos-latest
            vector-sample: "500"
          - os: windows-latest
            vector-sample: "500"
    runs-on: ${{ matrix.os }}
    env:
      # Missing vectors fail the run; without this they would be skipped.
      SFES_REQUIRE_VECTORS: "1"
      SFES_VECTOR_SAMPLE: ${{ matrix.vector-sample }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # The set is 2.6 GB and never committed. One archive serves all three systems: the files
      # are fetched with line-ending conversion off, so they are byte-identical everywhere.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/assets/vectors/65816
          key: vectors-65816-${{ hashFiles('tests/assets/vectors.lock') }}
          enableCrossOsArchive: true
      # Downloads on a cache miss; always verifies every file against vectors.lock.
      - run: cargo xtask vectors fetch 65816
      - run: cargo build --workspace --all-targets --locked
      - run: cargo nextest run --workspace --locked --no-tests=warn

  no-std:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, wasm32-unknown-unknown]
    name: no-std (${{ matrix.target }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # FND-10: chip and core crates (and blake3 inside sfes-api) build without std.
      - run: >-
          cargo build --locked --no-default-features --target ${{ matrix.target }}
          -p sfes -p sfes-api -p sfes-snes-cpu -p sfes-snes-spc -p sfes-snes-ppu
          -p sfes-snes-cart -p sfes-snes-core

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask provenance lint
      - run: cargo xtask provenance scan
      - run: cargo xtask provenance assets
      - run: cargo xtask deps
